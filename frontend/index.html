<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f6f5" />
    <meta
      name="description"
      content="Evidence-backed AI, focused operating workspaces, and custom software for organizations and founders."
    />
    <meta name="robots" content="index,follow" />
    <meta property="og:title" content="Edvatiq" />
    <meta property="og:description" content="Operating intelligence, evidence-backed AI, and focused custom software from Edvatiq." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://edvatiq.app" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="canonical" href="https://edvatiq.app" />
    <title>Edvatiq | Operating intelligence and custom software</title>
    <script>
      (function () {
        try {
          var storedValue = localStorage.getItem("edvatiq.appearance") || "light";
          var value = ["light", "dark", "system"].indexOf(storedValue) >= 0
            ? storedValue
            : "light";
          var dark =
            value === "dark" ||
            (value === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.dataset.appearance = value;
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (_) {}
      })();
    </script>
    <script>
      window.addEventListener(
        "error",
        function (event) {
          if (
            event.error instanceof DOMException &&
            event.error.name === "DataCloneError" &&
            event.message &&
            event.message.includes("PerformanceServerTiming")
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        },
        true,
      );
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
