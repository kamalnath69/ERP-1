<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#123a2e" />
    <meta name="description" content="Edvatiq operations platform for gyms, salons, clinics, and colleges" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Edvatiq Business OS</title>
    <script>
      (function () {
        try {
          var value = localStorage.getItem("edvatiq.appearance") || "system";
          var dark = value === "dark" || (value === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.dataset.appearance = value;
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (_) {}
      })();
    </script>
    <script>
      window.addEventListener("error", function (e) {
        if (
          e.error instanceof DOMException &&
          e.error.name === "DataCloneError" &&
          e.message &&
          e.message.includes("PerformanceServerTiming")
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
